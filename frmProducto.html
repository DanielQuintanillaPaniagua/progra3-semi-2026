<form id="frmProducto">
    <div class="card text-bg-dark mb-3" style="min-width: 600px;">
        <div class="card-header">
            <div class="d-flex">Admin de Productos
                <div class="ms-auto"><button data-form="productos" type="button" class="btn-close btn-close-white" aria-label="Close"></button></div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1"><div class="col-12 col-md-4"><input pattern="^[0-9]{3,10}$" required placeholder="Codigo" id="txtCodigoProducto" class="form-control" type="text"></div></div>
            <div class="row p-1"><div class="col-12 col-md-8"><input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Descripcion" id="txtDescripcionProducto" class="form-control" type="text"></div></div>
            <div class="row p-1"><div class="col-12"><select id="cboEstadoProducto" class="form-control"><option value="activo">Activo</option><option value="inactivo">Inactivo</option></select></div></div>
        </div>
        <div class="card-footer text-center">
            <input type="submit" value="Guardar" class="btn btn-primary" id="btnGuardarProducto">
            <input type="button" value="Buscar" class="btn btn-secondary" id="btnBuscarProducto">
            <input type="reset" value="Limpiar" class="btn btn-warning" id="btnLimpiarProducto">
        </div>
    </div>
</form>
<script>
var accionProducto='nuevo', idProducto='';
frmProducto.addEventListener('submit', e=>{e.preventDefault();guardarProductos();});
frmProducto.addEventListener('reset', e=>{e.preventDefault();limpiarFormularioProducto();});
function modificarProducto(data,event){
    event.preventDefault();
    idProducto=data.idProducto; accionProducto="modificar";
    txtCodigoProducto.value=data.codigo; txtDescripcionProducto.value=data.descripcion;
    cboEstadoProducto.value=data.estado;
}
async function guardarProductos(){
    let datos={modulo:"producto",codigo:txtCodigoProducto.value,descripcion:txtDescripcionProducto.value,
        estado:cboEstadoProducto.value,accion:accionProducto,idProducto:idProducto};
    let r=await fetch('/producto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)});
    let j=await r.json();
    if(j.msg!="ok"){alert("Error: "+j.msg);return;}
    if(typeof obtenerProductos==="function")obtenerProductos();
    limpiarFormularioProducto();
}
function limpiarFormularioProducto(){
    accionProducto='nuevo'; idProducto='';
    txtCodigoProducto.value=''; txtDescripcionProducto.value=''; cboEstadoProducto.value='activo';
}
btnBuscarProducto.addEventListener('click', e=>{e.preventDefault();cargarForm('busqueda_productos');});
</script>
