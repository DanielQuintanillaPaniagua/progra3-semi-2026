<form id="frmConsultarUsuario">
    <div class="card text-bg-dark mb-3" style="min-width: 700px;">
        <div class="card-header">
            <div class="d-flex">Busqueda de Usuarios
                <div class="ms-auto"><button data-form="busqueda_usuarios" type="button" class="btn-close btn-close-white"></button></div>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr><th colspan="5"><input type="search" placeholder="buscar" id="txtBuscarUsuario" class="form-control"></th></tr>
                        <tr><th>Usuario</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th></th></tr>
                    </thead>
                    <tbody id="tblUsuarios"></tbody>
                </table>
            </div>
        </div>
    </div>
</form>
<script>
// Variable global para guardar los datos temporalmente
var datosUsuarios = [];

txtBuscarUsuario.addEventListener('keyup', e => { e.preventDefault(); obtenerUsuarios(txtBuscarUsuario.value); });
obtenerUsuarios();

async function obtenerUsuarios(buscar = "") {
    let r = await fetch(`/usuarios?buscar=${buscar}`);
    datosUsuarios = await r.json(); // Guardamos el JSON en memoria
    
    let filas = "";
    datosUsuarios.forEach(e => {
        // Solo pasamos el ID a la función, NO el JSON completo
        filas += `<tr onClick='seleccionarUsuario(${e.idUsuario}, event)'>
            <td>${e.usuario}</td><td>${e.nombre}</td><td>${e.direccion||''}</td><td>${e.telefono||''}</td>
            <td><input onClick='eliminarUsuario(${e.idUsuario}, event)' type="button" value="DEL" class="btn btn-danger"/></td>
        </tr>`;
    });
    tblUsuarios.innerHTML = filas;
}

// Buscamos el objeto completo usando el ID
function seleccionarUsuario(id, event) {
    if (event) event.preventDefault();
    let data = datosUsuarios.find(u => u.idUsuario === id);
    if (data) modificarUsuario(data, event);
}

// Eliminamos usando el ID
function eliminarUsuario(id, event) {
    event.preventDefault(); 
    event.stopPropagation();
    let data = datosUsuarios.find(u => u.idUsuario === id);
    if (data && confirm(`¿Seguro de eliminar al usuario: ${data.nombre}?`)) {
        idUsuario = id; 
        accionUsuario = "eliminar"; 
        guardarUsuario();
    }
}
</script>
