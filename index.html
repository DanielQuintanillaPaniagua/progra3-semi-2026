<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Impuestos a las Actividades Economicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container-fluid p-3">

        <!-- Botonera superior para abrir cada modulo -->
        <div class="d-flex gap-2 mb-3">
            <button class="btn btn-primary" onclick="cargarForm('clientes')">Clientes</button>
            <button class="btn btn-primary" onclick="cargarForm('productos')">Productos</button>
            <button class="btn btn-primary" onclick="cargarForm('periodos')">Periodos</button>
        </div>

        <!-- Contenedor donde se cargan los formularios dinamicos -->
        <div id="contenedorFormularios" class="d-flex flex-wrap gap-3"></div>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /* ==================== CARGA DINAMICA DE FORMULARIOS ==================== */
        async function cargarForm(nombre) {
            let archivo = "";

            // Mapeo de nombre logico -> archivo HTML del formulario
            switch (nombre) {
                case 'clientes': archivo = 'frmCliente.html'; break;
                case 'productos': archivo = 'frmProducto.html'; break;
                case 'busqueda_productos': archivo = 'frmConsultarProducto.html'; break;
                case 'busqueda_clientes': archivo = 'frmConsultarCliente.html'; break;
                case 'periodos': archivo = 'frmPeriodo.html'; break;
                default:
                    alert("Modulo no reconocido: " + nombre);
                    return;
            }

            // Si el formulario ya esta abierto, no lo duplicamos
            if (document.getElementById("frm" + capitalizar(nombre))) {
                return;
            }

            try {
                let response = await fetch(archivo);
                if (!response.ok) {
                    alert("No se pudo cargar: " + archivo);
                    return;
                }
                let html = await response.text();

                // Crear contenedor e inyectar el HTML
                let div = document.createElement("div");
                div.id = "form_" + nombre;
                div.innerHTML = html;

                // Ejecutar los <script> internos manualmente
                div.querySelectorAll("script").forEach(scriptViejo => {
                    let scriptNuevo = document.createElement("script");
                    scriptNuevo.textContent = scriptViejo.textContent;
                    scriptViejo.replaceWith(scriptNuevo);
                });

                document.getElementById("contenedorFormularios").appendChild(div);

                // Asignar evento al boton de cerrar
                div.querySelectorAll("[data-form]").forEach(btn => {
                    btn.addEventListener("click", () => div.remove());
                });

            } catch (e) {
                alert("Error al cargar el formulario: " + e.message);
            }
        }

        function capitalizar(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        /* ==================== INIT ==================== */
        document.addEventListener("DOMContentLoaded", () => {
            cargarForm('clientes');
        });
    </script>
</body>

</html>
