<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Impuestos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid p-3">
    <div class="d-flex gap-2 mb-3">
        <button class="btn btn-primary" onclick="cargarForm('clientes')">Clientes</button>
        <button class="btn btn-primary" onclick="cargarForm('productos')">Productos</button>
    </div>
    <div id="contenedorFormularios" class="d-flex flex-wrap gap-3"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function cargarForm(nombre) {
    let archivo = "";
    switch (nombre) {
        case 'clientes':            archivo = 'frmCliente.html'; break;
        case 'busqueda_clientes':   archivo = 'frmConsultarCliente.html'; break;
        case 'productos':           archivo = 'frmProducto.html'; break;
        case 'busqueda_productos':  archivo = 'frmConsultarProducto.html'; break;
        default: alert("Modulo no reconocido: " + nombre); return;
    }
    if (document.getElementById("form_" + nombre)) return;
    try {
        let response = await fetch(archivo);
        if (!response.ok) { alert("No se pudo cargar: " + archivo); return; }
        let html = await response.text();
        let div = document.createElement("div");
        div.id = "form_" + nombre;
        div.innerHTML = html;
        div.querySelectorAll("script").forEach(sv => {
            let sn = document.createElement("script");
            sn.textContent = sv.textContent;
            sv.replaceWith(sn);
        });
        document.getElementById("contenedorFormularios").appendChild(div);
        div.querySelectorAll("[data-form]").forEach(btn => {
            btn.addEventListener("click", () => div.remove());
        });
    } catch (e) { alert("Error: " + e.message); }
}
document.addEventListener("DOMContentLoaded", () => cargarForm('clientes'));
</script>
</body>
</html>
