<form id="frmConsultarProducto">
    <div class="card text-bg-dark mb-3" style="min-width: 600px;">
        <div class="card-header">
            <div class="d-flex">
                Busqueda de Productos
                <div class="ms-auto">
                    <button data-form="busqueda_productos" type="button" class="btn-close btn-close-white"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th colspan="7">
                                        <input type="search" placeholder="buscar por codigo, nombre"
                                            id="txtBuscarProducto" name="txtBuscarProducto" class="form-control">
                                    </th>
                                </tr>
                                <tr>
                                    <th>Codigo</th>
                                    <th>Nombre</th>
                                    <th>Marca</th>
                                    <th>Precio</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tblProductos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
<script>
    // Escuchar el evento de búsqueda
    txtBuscarProducto.addEventListener('keyup', (e) => {
        e.preventDefault();
        obtenerProductos(txtBuscarProducto.value);
    });

    // Cargar productos al iniciar
    obtenerProductos();

    async function obtenerProductos(buscar = "") {
        try {
            let response = await fetch(`busqueda_productos/?buscar=${buscar}`);

            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }

            let datos = await response.json();

            // Verificamos que la respuesta tenga la estructura esperada
            if (!datos.datos) {
                console.error("El servidor no devolvió la clave 'datos'", datos);
                return;
            }

            mostrarDatos(datos);

        } catch (error) {
            console.error("Error al obtener productos:", error);
            // Opcional: mostrar un mensaje en la tabla
            tblProductos.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Error al cargar los productos</td></tr>`;
        }
    }

    function mostrarDatos(respuesta) {
        let filas = "";
        respuesta.datos.forEach(e => {
            // Es más seguro pasar solo el ID y buscar el objeto luego, 
            // pero mantendré tu lógica por ahora (ten cuidado con las comillas en los nombres)
            let productoJson = JSON.stringify(e).replace(/'/g, "&#39;"); // Escapar comillas simples

            filas += `
                <tr>
                    <td>${e.codigo}</td>
                    <td>${e.nombre}</td>
                    <td>${e.marca}</td>
                    <td>${e.precio}</td>
                    <td>
                        <button onclick='modificarProducto(${productoJson}, event)' class="btn btn-primary btn-sm">Editar</button>
                        <button onclick='eliminarProducto(${productoJson}, event)' class="btn btn-danger btn-sm">DEL</button>
                    </td>
                </tr>
            `;
        });
        tblProductos.innerHTML = filas;
    }

    function eliminarProducto(data, event) {
        event.preventDefault();
        if (confirm(`¿Seguro de eliminar al producto: ${data.nombre}?`)) {
            id = data.id;
            accion = "eliminar";

            if (typeof guardarProductos === "function") {
                guardarProductos();
            } else {
                console.error("La función guardarProductos no está definida en este contexto");
            }
        }
    }
</script>
